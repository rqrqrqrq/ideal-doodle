name: Deploy to Dev Environment

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to deploy'
        required: true
        default: 'main'
        type: string

permissions:
  contents: write

jobs:
  build-and-deploy:
    name: Build and Deploy to Dev
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build for dev
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/dev/
        run: npm run build:dev

      - name: Deploy to GitHub Pages (dev subdirectory)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          destination_dir: dev
          keep_files: true

      - name: Output deployment URL
        run: |
          echo "Dev environment deployed to: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/dev/"
